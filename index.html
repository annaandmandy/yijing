<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-Ching Lab | 沉浸式 3D 抽爻</title>
    <link rel="stylesheet" href="./src/styles/main.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Serif+TC:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="dark-mode">
    <div id="app">
        <!-- Navigation Bar -->
        <nav class="glass-nav">
            <div class="logo">I-Ching Lab</div>
            <div class="nav-links">
                <a href="#tabletop" class="active">抽爻 Tabletop</a>
                <a href="#ai-mentor">導師 AI Mentor</a>
                <a href="#library">圖書館 Library</a>
                <a href="#history">每日紀錄 Journal</a>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="view-container">
            <!-- 3D Tabletop View -->
            <section id="tabletop" class="view active">
                <div class="question-container">
                    <input type="text" id="user-question" placeholder="輸入你想問的事（今日運勢、創業建議）..." class="glass-input">
                </div>
                <div id="canvas-container">
                    <!-- Three.js Canvas will be injected here -->
                    <div class="instruction">震動手機或按住拖拽以投擲</div>
                    <!-- Real-time Hexagram Progress -->
                    <div id="casting-progress" class="glass-panel"></div>
                </div>
            </section>

            <!-- Library View -->
            <section id="library" class="view">
                <div class="library-sub-nav glass-panel">
                    <button class="sub-nav-btn active" data-sub="grid">卦象</button>
                    <button class="sub-nav-btn" data-sub="bagua">八卦圖</button>
                    <button class="sub-nav-btn" data-sub="lookup">進階</button>
                    <button class="sub-nav-btn" data-sub="learn">自學</button>
                </div>

                <!-- Subpages -->
                <div id="subpage-grid" class="library-subpage active">
                    <div class="header">
                        <h2>全卦圖書館</h2>
                        <div class="filters"></div>
                    </div>
                    <div id="hex-grid" class="grid-container"></div>
                </div>

                <div id="subpage-bagua" class="library-subpage">
                    <div class="header">
                        <h2>八卦示意圖</h2>
                    </div>
                    <div id="bagua-diagram-container" class="glass-panel">
                        <!-- Interactive Bagua SVG will go here -->
                        <div class="placeholder-text">八卦互動圖表加載中...</div>
                    </div>
                </div>

                <div id="subpage-lookup" class="library-subpage">
                    <div class="header">
                        <h2>進階對照工具</h2>
                    </div>
                    <div class="lookup-tables">
                        <!-- Najia and Five Elements tables -->
                    </div>
                </div>

                <div id="subpage-learn" class="library-subpage">
                    <div class="header">
                        <h2>自學與導航</h2>
                    </div>
                    <div class="learn-content glass-panel">
                        <!-- Markdown articles -->
                    </div>
                </div>
            </section>

            <!-- History View -->
            <section id="history" class="view">
                <div class="calendar-header-wrapper">
                    <div class="header">
                        <h2>每日抽爻紀錄</h2>
                        <div class="calendar-nav">
                            <button id="prev-month" class="nav-btn">上個月</button>
                            <span id="current-month-display">2026年3月</span>
                            <button id="next-month" class="nav-btn">下個月</button>
                        </div>
                    </div>
                </div>

                <div id="history-container">
                    <div class="calendar-layout">
                        <div class="calendar-grid-card glass-panel">
                            <div id="calendar-grid">
                                <!-- Calendar grid will be generated here -->
                            </div>
                        </div>

                        <div class="stats-card glass-panel">
                            <h3>本月五行分佈</h3>
                            <div class="chart-container">
                                <canvas id="radar-chart"></canvas>
                            </div>
                            <div id="stats-summary" class="stats-summary">
                                <!-- Monthly summary text -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- AI Mentor View -->
            <section id="ai-mentor" class="view">
                <div class="ai-mentor-container">
                    <div id="ai-chat-container-main" class="glass-panel">
                        <div class="chat-header">
                            <h4 id="mentor-current-hex">等待卦象中...</h4>
                            <span class="chat-status">感應中...</span>
                        </div>
                        <div id="chat-history-main" class="chat-scroll">
                            <p class="empty-state">請先完成抽爻，或從紀錄中選擇一卦以開始與導師對話。</p>
                        </div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input-main" placeholder="向導師請教更多細節...">
                            <button id="send-chat-main" class="btn-icon">➤</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Global Result Overlay (Fixed for stability) -->
        <div id="result-overlay" class="hidden glass-panel">
            <button class="close-btn" id="close-result-overlay">×</button>
            <div class="binary-display"></div>
            <h1 class="hex-name">--</h1>

            <!-- Target Focus Selection -->
            <div class="focus-selectors">
                <small>針對特定的事分析：</small>
                <div class="btn-group">
                    <button class="btn-focus" data-type="career">問事業</button>
                    <button class="btn-focus" data-type="wealth">問金錢</button>
                    <button class="btn-focus" data-type="love">問感情</button>
                </div>
            </div>

            <!-- Najia Info List -->
            <div id="najia-info" class="hidden">
                <div class="palace-info"></div>
                <div class="lines-najia"></div>
            </div>

            <p class="hex-summary"></p>
            <button id="ask-mentor-result" class="btn-primary">請導師解籤</button>
            <button id="copy-result" class="btn-secondary">複製結果</button>
            <button id="re-toss" class="btn-secondary">再次投擲</button>
        </div>

        <!-- Detail Modal -->
        <div id="detail-modal" class="modal">
            <div class="modal-content glass-panel">
                <span class="close-btn">&times;</span>
                <div class="modal-body">
                    <!-- Dynamic content will be injected here -->
                </div>

                <button id="ask-ai" class="btn-primary">啟動 AI 導航</button>
            </div>
        </div>
    </div>

    <!-- Main JS entry -->
    <script type="module" src="src/app.js"></script>
</body>

</html>
